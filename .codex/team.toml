schema_version = 1

[root]
model = "gpt-5.6-sol"
reasoning = "high"

[profiles.reader]
config = "agents/reader.toml"
kind = "reader"
permissions = ":read-only"
capabilities = ["repository_read", "external_read", "read_only_diagnostics"]

[profiles.worker]
config = "agents/worker.toml"
kind = "writer"
permissions = ":workspace"
capabilities = ["repository_read", "workspace_write", "targeted_checks"]

[profiles.reviewer]
config = "agents/reviewer.toml"
kind = "reviewer"
permissions = ":read-only"
capabilities = ["repository_read", "read_only_diagnostics", "fresh_review", "targeted_continuation"]

[profiles.challenger]
config = "agents/challenger.toml"
kind = "reviewer"
permissions = ":read-only"
capabilities = ["repository_read", "read_only_diagnostics", "fresh_review", "publication_challenge"]

[workflows.clear-defect-backlog]
skill = "skills/clear-defect-backlog/SKILL.md"
profiles = ["reader", "worker", "reviewer", "challenger"]
writer_profile = "worker"
default_review_tasks = ["ticket_acceptance", "code_quality"]

[workflows.deliver-focused-change]
skill = "skills/deliver-focused-change/SKILL.md"
profiles = ["reader", "worker", "reviewer", "challenger"]
writer_profile = "worker"
default_review_tasks = ["acceptance", "code_quality"]

[workflows.deliver-functional-slice]
skill = "skills/deliver-functional-slice/SKILL.md"
profiles = ["reader", "worker", "reviewer", "challenger"]
writer_profile = "worker"
default_review_tasks = ["slice_acceptance", "code_quality"]

[workflows.explore-product-ideas]
skill = "skills/explore-product-ideas/SKILL.md"
profiles = ["reader"]
writer_profile = ""
default_review_tasks = []

[workflows.maintain-open-prs]
skill = "skills/maintain-open-prs/SKILL.md"
profiles = ["reader", "worker", "reviewer", "challenger"]
writer_profile = "worker"
default_review_tasks = ["requirements", "code_quality"]

[workflows.prepare-ready-work]
skill = "skills/prepare-ready-work/SKILL.md"
profiles = ["reader", "reviewer", "challenger"]
writer_profile = ""
default_review_tasks = ["readiness"]

[budgets]
profiles_max = 4
runtime_python_lines_max = 2500
test_python_lines_max = 2500
skill_entry_lines_max = 180
mandatory_shared_reads_max = 3
