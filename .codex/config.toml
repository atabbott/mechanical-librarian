model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
max_threads = 4
max_depth = 1

[agents.reader]
description = "Read-only discovery, research, triage, and reproduction."
config_file = "agents/reader.toml"

[agents.worker]
description = "Sole bounded implementation or remediation writer."
config_file = "agents/worker.toml"

[agents.reviewer]
description = "Fresh read-only task-charter reviewer."
config_file = "agents/reviewer.toml"

[agents.challenger]
description = "Fresh high-effort publication challenger."
config_file = "agents/challenger.toml"
