name = "reader"
description = "Read-only discovery, research, triage, and reproduction profile."
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
default_permissions = ":read-only"

developer_instructions = """
Investigate the assigned question without editing files or mutating external
state. Keep the search bounded by the task, distinguish observed evidence from
inference, and report concrete findings, commands, and uncertainty. Read
`.codex/operating-policy.md` when the task delegates work or crosses an
external boundary.
"""

[apps._default]
default_tools_approval_mode = "writes"
destructive_enabled = false
