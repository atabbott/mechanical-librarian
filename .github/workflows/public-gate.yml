name: Public repository gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull-request work is grouped by pull request; a push to `main` is grouped by
  # the merged commit so no post-merge verification shares a group with another.
  group: public-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # A superseding pull-request head may cancel obsolete work for that pull
  # request. Delivery publishes one converged candidate whenever possible.
  # A merged `main` commit is verified exactly once and is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.15"

      - name: Install the exact frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --locked --all-groups

      - name: Check the Python source formatting
        run: uv run ruff format --check src tests scripts

      - name: Lint the Python source
        run: uv run ruff check src tests scripts

      - name: Typecheck the Python source
        run: uv run mypy src tests scripts

      - name: Qualify the frontend source
        working-directory: frontend
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate -- --output "$RUNNER_TEMP/review-api-a.d.ts"
          npm run generate -- --output "$RUNNER_TEMP/review-api-b.d.ts"
          cmp "$RUNNER_TEMP/review-api-a.d.ts" "$RUNNER_TEMP/review-api-b.d.ts"
          npm run generate
          npm run typecheck
          npm run lint
          npm run licenses
          npm test
          npm audit --audit-level=low
          ML_FRONTEND_OUT_DIR="$RUNNER_TEMP/frontend-build-a" npm run build
          ML_FRONTEND_OUT_DIR="$RUNNER_TEMP/frontend-build-b" npm run build
          diff -r "$RUNNER_TEMP/frontend-build-a" "$RUNNER_TEMP/frontend-build-b"
          git diff --exit-code

      - name: Run the fast source tier
        run: uv run python scripts/run_test_tier.py fast

  exact-installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.15"

      - name: Install the exact frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Qualify the exact installed artifact
        run: >-
          python3
          scripts/qualify_exact_artifact.py
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --test-tier required

  protected-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.15"

      - name: Install the exact frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --locked --all-groups

      - name: Resolve the pinned Playwright version
        id: playwright
        run: >-
          uv run python -c
          'from importlib.metadata import version; print("version=" + version("playwright"))'
          >> "$GITHUB_OUTPUT"

      - name: Restore the cached Chromium qualification payload
        id: chromium-payload
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install the Chromium qualification browser
        run: uv run playwright install --with-deps chromium

      - name: Record the Chromium qualification payload
        run: uv run python scripts/verify_playwright_browser.py

      # Saved only after the payload is accepted, so a malformed one is never
      # persisted for a later run to restore.
      - name: Save the recorded Chromium qualification payload
        if: steps.chromium-payload.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium-payload.outputs.cache-primary-key }}

      - name: Build the exact React browser artifact
        working-directory: frontend
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate
          ML_FRONTEND_OUT_DIR="$RUNNER_TEMP/react-assets" npm run build

      - name: Run the protected browser tier
        env:
          ML_REACT_ASSET_DIR: ${{ runner.temp }}/react-assets
        run: uv run python scripts/run_test_tier.py browser

  container-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The shipped image must assemble from the exact revision. The build is
      # never pushed, loaded, or run here: running the built image's lifecycle
      # qualifier stays a documented maintainer-manual step.
      - name: Build the shipped container image
        run: docker build --pull --tag mechanical-librarian:gate .

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # `uv.lock` is the complete resolved closure -- runtime and development
      # alike -- so this audits both what ships and what CI installs. The
      # scanner is pinned by image digest rather than through
      # `google/osv-scanner-action`, which resolves a mutable image tag
      # internally and documents that its behaviour may change in a patch
      # release; the digest below is `ghcr.io/google/osv-scanner:v2.5.0`.
      # Advisory data is fetched from OSV at run time, so a pinned scanner
      # still sees current advisories. `--config` is explicit so a deleted or
      # renamed acceptance register fails the job instead of silently
      # disabling every acceptance's expiry.
      - name: Audit the locked Python dependency closure
        run: >-
          docker run --rm
          --volume "$PWD:/src:ro"
          --workdir /src
          ghcr.io/google/osv-scanner@sha256:5b8b38e45bb2c5c4976f0f1f07860551ea6e1f235f642cf215f74d266fec2c1b
          scan source
          --lockfile=uv.lock
          --config=osv-scanner.toml
