name: Public repository gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-gate-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number }}
  # A superseding pull-request head may cancel obsolete work. Each push event
  # to main runs at its tip SHA and cannot be cancelled by a later push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install the exact frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.11.28"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --locked --all-groups

      - name: Qualify the frontend source
        working-directory: frontend
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate -- --output "$RUNNER_TEMP/review-api-a.d.ts"
          npm run generate -- --output "$RUNNER_TEMP/review-api-b.d.ts"
          cmp "$RUNNER_TEMP/review-api-a.d.ts" "$RUNNER_TEMP/review-api-b.d.ts"
          npm run generate
          npm run typecheck
          npm run lint
          npm run licenses
          npm test
          npm audit --audit-level=low
          ML_FRONTEND_OUT_DIR="$RUNNER_TEMP/frontend-build-a" npm run build
          ML_FRONTEND_OUT_DIR="$RUNNER_TEMP/frontend-build-b" npm run build
          diff -r "$RUNNER_TEMP/frontend-build-a" "$RUNNER_TEMP/frontend-build-b"
          git diff --exit-code

      - name: Run the fast source tier
        run: uv run python scripts/run_test_tier.py fast

  exact-installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install the exact frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.11.28"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Qualify the exact installed artifact
        run: >-
          python3
          scripts/qualify_exact_artifact.py
          --source-sha "${{ github.sha }}"
          --test-tier required

  protected-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install the exact frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.11.28"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --locked --all-groups

      - name: Install the pinned Chromium qualification browser
        run: uv run playwright install --with-deps chromium

      - name: Verify the exact Chromium qualification payload
        run: uv run python scripts/verify_playwright_browser.py

      - name: Build the exact React browser artifact
        working-directory: frontend
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate
          ML_FRONTEND_OUT_DIR="$RUNNER_TEMP/react-assets" npm run build

      - name: Run the protected browser tier
        env:
          ML_REACT_ASSET_DIR: ${{ runner.temp }}/react-assets
        run: uv run python scripts/run_test_tier.py browser

  public-gate:
    if: always()
    needs: [fast-source, exact-installed, protected-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every public qualification tier
        env:
          FAST_SOURCE_RESULT: ${{ needs.fast-source.result }}
          EXACT_INSTALLED_RESULT: ${{ needs.exact-installed.result }}
          PROTECTED_BROWSER_RESULT: ${{ needs.protected-browser.result }}
        run: |
          test "$FAST_SOURCE_RESULT" = success
          test "$EXACT_INSTALLED_RESULT" = success
          test "$PROTECTED_BROWSER_RESULT" = success
