name: Public repository gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull-request work is grouped by pull request; a push to `main` is grouped by
  # the merged commit so no post-merge verification shares a group with another.
  group: public-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # A superseding pull-request head may cancel obsolete work for that pull
  # request. Delivery publishes one converged candidate whenever possible.
  # A merged `main` commit is verified exactly once and is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.8"

      - name: Install the exact frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the manifest-pinned npm
        run: npm install --global --ignore-scripts --no-audit --no-fund "npm@$(node -p 'require("./frontend/package.json").engines.npm')"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          version: "0.12.23"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --locked --all-groups

      - name: Check the Python source formatting
        run: uv run ruff format --check src tests scripts

      - name: Lint the Python source
        run: uv run ruff check src tests scripts

      - name: Typecheck the Python source
        run: uv run mypy src tests scripts

      - name: Verify the live documentation corpus
        run: uv run python scripts/verify_documentation_integrity.py

      - name: Verify every direct dependency carries an authority grant
        run: uv run python scripts/verify_dependency_authority.py

      - name: Qualify the frontend source
        working-directory: frontend
        run: |
          test "$(node --version)" = "v$(node -p 'require("./package.json").engines.node')"
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate -- --output "$RUNNER_TEMP/review-api-a.d.ts"
          npm run generate -- --output "$RUNNER_TEMP/review-api-b.d.ts"
          cmp "$RUNNER_TEMP/review-api-a.d.ts" "$RUNNER_TEMP/review-api-b.d.ts"
          npm run generate
          npm run typecheck
          npm run lint
          npm run licenses
          npm test
          npm audit --audit-level=low
          ML_FRONTEND_OUT_DIR="$RUNNER_TEMP/frontend-build-a" npm run build
          ML_FRONTEND_OUT_DIR="$RUNNER_TEMP/frontend-build-b" npm run build
          diff -r "$RUNNER_TEMP/frontend-build-a" "$RUNNER_TEMP/frontend-build-b"
          git diff --exit-code

      - name: Run the fast source tier
        run: uv run python scripts/run_test_tier.py fast

  exact-installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.8"

      - name: Install the exact frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the manifest-pinned npm
        run: npm install --global --ignore-scripts --no-audit --no-fund "npm@$(node -p 'require("./frontend/package.json").engines.npm')"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          version: "0.12.23"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Qualify the exact installed artifact
        run: >-
          python3
          scripts/qualify_exact_artifact.py
          --source-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          --test-tier required

  protected-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.8"

      - name: Install the exact frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the manifest-pinned npm
        run: npm install --global --ignore-scripts --no-audit --no-fund "npm@$(node -p 'require("./frontend/package.json").engines.npm')"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          version: "0.12.23"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --locked --all-groups

      - name: Resolve the pinned Playwright version
        id: playwright
        run: >-
          uv run python -c
          'from importlib.metadata import version; print("version=" + version("playwright"))'
          >> "$GITHUB_OUTPUT"

      - name: Restore the cached Chromium qualification payload
        id: chromium-payload
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # `--with-deps` is deliberately absent (#772). The payload cache covers
      # `~/.cache/ms-playwright` and nothing else, so on a cache hit the flag's
      # only contribution was `apt-get` -- and an unreachable
      # `azure.archive.ubuntu.com` twice spent this job's entire ten-minute
      # budget inside it without running one test. The `ubuntu-24.04` image
      # already ships Chromium's shared libraries, so the flag bought a stall
      # rather than a dependency.
      #
      # The step is bounded so the next stall of any kind fails fast and named
      # instead of consuming the tier. On a cache hit this step does nothing
      # and on a miss it fetches one pinned payload, so four minutes is slack
      # rather than a limit anything normal approaches.
      - name: Install the Chromium qualification browser
        timeout-minutes: 4
        run: uv run playwright install chromium

      - name: Record the Chromium qualification payload
        run: uv run python scripts/verify_playwright_browser.py

      # Saved only after the payload is accepted, so a malformed one is never
      # persisted for a later run to restore.
      - name: Save the recorded Chromium qualification payload
        if: steps.chromium-payload.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium-payload.outputs.cache-primary-key }}

      # Dropping `--with-deps` moves the risk from "the mirror stalls" to "the
      # image stops supplying a library Chromium needs", and that second risk
      # is given a step of its own so it can never be read as a browser-tier
      # regression. Recording the payload resolves an executable path without
      # starting a process; this starts one. A missing library therefore fails
      # here, in a named step that runs no test, rather than inside the
      # browser tier below, where it would look like a browser defect.
      # It runs after the save because an image without a library says nothing
      # about the payload, which is still worth caching.
      - name: Verify the runner supplies Chromium's shared libraries
        timeout-minutes: 2
        run: uv run python scripts/verify_playwright_browser.py --launch

      - name: Build the exact React browser artifact
        working-directory: frontend
        run: |
          test "$(node --version)" = "v$(node -p 'require("./package.json").engines.node')"
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate
          ML_FRONTEND_OUT_DIR="$RUNNER_TEMP/react-assets" npm run build

      - name: Run the protected browser tier
        env:
          ML_REACT_ASSET_DIR: ${{ runner.temp }}/react-assets
        run: uv run python scripts/run_test_tier.py browser

  container-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.8"

      - name: Install the exact frontend toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the manifest-pinned npm
        run: npm install --global --ignore-scripts --no-audit --no-fund "npm@$(node -p 'require("./frontend/package.json").engines.npm')"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          version: "0.12.23"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --locked --all-groups

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # The action downloads the Buildx binary at run time; without this
          # pin an unchanged commit would execute whatever upstream released
          # last.
          version: v0.36.1

      # The shipped image must assemble from the exact revision. The build is
      # never pushed or run here: running the built image's lifecycle
      # qualifier stays a documented maintainer-manual step. It is loaded into
      # the runner's daemon for exactly one purpose -- extracting the pinned
      # probe binary the tier below executes (#929). Layers restore
      # from the repository Actions cache; a step re-executes only when its
      # inputs change. Base-image freshness comes from the digest pins the
      # Dockerfile carries on every FROM line, not from `--pull` -- a base
      # moves only when its pinned digest is bumped.
      - name: Build the shipped container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          tags: mechanical-librarian:gate
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runner image preinstalls a distribution ffmpeg at
      # `/usr/bin/ffprobe`, which is first in the closed candidate set the
      # inspector resolves. It is removed so the tier can only ever execute
      # the binary the shipped image pins -- a pass that ran the distribution
      # probe would prove nothing about the pin. The version assertion reads
      # the Dockerfile's own ARG, so a pin bump stays a one-file change.
      - name: Install the image's pinned probe binary
        run: |
          sudo rm -f /usr/bin/ffprobe
          container="$(docker create mechanical-librarian:gate)"
          docker cp "${container}:/usr/local/bin/ffprobe" "$RUNNER_TEMP/ffprobe"
          docker rm "${container}"
          sudo install -m 0755 "$RUNNER_TEMP/ffprobe" /usr/local/bin/ffprobe
          version="$(sed -n 's/^ARG FFMPEG_VERSION=//p' Dockerfile)"
          /usr/local/bin/ffprobe -version | head -n 1 | grep -F "ffprobe version ${version:?}"
          test ! -e /usr/bin/ffprobe

      - name: Run the probe tier against the shipped binary
        run: uv run python scripts/run_test_tier.py probe

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # `uv.lock` is the complete resolved closure -- runtime and development
      # alike -- so this audits both what ships and what CI installs. The
      # scanner is pinned by image digest rather than through
      # `google/osv-scanner-action`, which resolves a mutable image tag
      # internally and documents that its behaviour may change in a patch
      # release; the tag identifies the release and the digest binds its bytes.
      # Advisory data is fetched from OSV at run time, so a pinned scanner
      # still sees current advisories. `--config` is explicit so a deleted or
      # renamed acceptance register fails the job instead of silently
      # disabling every acceptance's expiry.
      - name: Audit the locked Python dependency closure
        run: >-
          docker run --rm
          --volume "$PWD:/src:ro"
          --workdir /src
          ghcr.io/google/osv-scanner:v2.5.0@sha256:5b8b38e45bb2c5c4976f0f1f07860551ea6e1f235f642cf215f74d266fec2c1b
          scan source
          --lockfile=uv.lock
          --config=osv-scanner.toml
