# Temporary diagnostic for #1567. Not for merge.
name: Diagnose 1567

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.8"

      - name: Install the exact frontend toolchain
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: ${{ github.event_name == 'push' && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install the manifest-pinned npm
        run: npm install --global --ignore-scripts --no-audit --no-fund "npm@$(node -p 'require("./frontend/package.json").engines.npm')"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' }}
          version: "0.12.23"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --locked --all-groups

      - name: Resolve the pinned Playwright version
        id: playwright
        run: >-
          uv run python -c
          'from importlib.metadata import version; print("version=" + version("playwright"))'
          >> "$GITHUB_OUTPUT"

      - name: Restore the cached Chromium qualification payload
        id: chromium-payload
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # `--with-deps` is deliberately absent (#772). The payload cache covers
      # `~/.cache/ms-playwright` and nothing else, so on a cache hit the flag's
      # only contribution was `apt-get` -- and an unreachable
      # `azure.archive.ubuntu.com` twice spent this job's entire ten-minute
      # budget inside it without running one test. The `ubuntu-24.04` image
      # already ships Chromium's shared libraries, so the flag bought a stall
      # rather than a dependency.
      #
      # The step is bounded so the next stall of any kind fails fast and named
      # instead of consuming the tier. On a cache hit this step does nothing
      # and on a miss it fetches one pinned payload, so four minutes is slack
      # rather than a limit anything normal approaches.
      - name: Install the Chromium qualification browser
        timeout-minutes: 4
        run: uv run playwright install chromium

      - name: Record the Chromium qualification payload
        run: uv run python scripts/verify_playwright_browser.py

      # Saved only after the payload is accepted, so a malformed one is never
      # persisted for a later run to restore. Only a push to `main` writes it;
      # a pull request restores and verifies the payload but never saves one.

      # Dropping `--with-deps` moves the risk from "the mirror stalls" to "the
      # image stops supplying a library Chromium needs", and that second risk
      # is given a step of its own so it can never be read as a browser-tier
      # regression. Recording the payload resolves an executable path without
      # starting a process; this starts one. A missing library therefore fails
      # here, in a named step that runs no test, rather than inside the
      # browser tier below, where it would look like a browser defect.
      # It runs after the save because an image without a library says nothing
      # about the payload, which is still worth caching.
      - name: Verify the runner supplies Chromium's shared libraries
        timeout-minutes: 2
        run: uv run python scripts/verify_playwright_browser.py --launch

      - name: Build the exact React browser artifact
        working-directory: frontend
        run: |
          test "$(node --version)" = "v$(node -p 'require("./package.json").engines.node')"
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate
          ML_FRONTEND_OUT_DIR="$RUNNER_TEMP/react-assets" npm run build

      - name: Run the diagnostic loops
        env:
          ML_REACT_ASSET_DIR: ${{ runner.temp }}/react-assets
        run: bash scripts/diag_1567/diag.sh
