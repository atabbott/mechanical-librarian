name: Require linked implementation issue

on:
  pull_request_target:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check out the bounded validator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Query GitHub-recognized closing issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          gh api graphql \
            -f owner="$owner" \
            -f name="$repository" \
            -F number="$PR_NUMBER" \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){nameWithOwner defaultBranchRef{name} pullRequest(number:$number){isDraft baseRefName bodyHTML allClosingIssues:closingIssuesReferences(first:100){totalCount pageInfo{hasNextPage} nodes{number state repository{nameWithOwner}}} manualClosingIssues:closingIssuesReferences(first:100,userLinkedOnly:true){totalCount pageInfo{hasNextPage} nodes{number state repository{nameWithOwner}}}}}}' \
            | python3 .github/scripts/validate_linked_issues.py \
                --repository "$GITHUB_REPOSITORY"
