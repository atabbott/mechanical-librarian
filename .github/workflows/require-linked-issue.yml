name: Require linked implementation issue

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  pull-requests: read

jobs:
  linked-issue:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Require an auto-closing issue reference
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          if grep -Eiq '(^|[[:space:]])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' <<<"$PR_BODY"; then
            exit 0
          fi
          echo "A ready-for-review pull request must include a real 'Closes #123', 'Fixes #123', or 'Resolves #123' reference."
          echo "GitHub will then close the linked issue automatically when the pull request merges."
          exit 1
