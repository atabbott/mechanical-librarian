[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanical-librarian"
dynamic = ["version"]
description = "Evidence-driven ebook and audiobook metadata curation"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "fastapi==0.116.1",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "hypothesis==6.156.6",
  "playwright==1.61.0",
  "setuptools==83.0.0",
]

[project.scripts]
mechanical-librarian = "mechanical_librarian.bootstrap:main"

[project.urls]
Documentation = "https://github.com/atabbott/mechanical-librarian/tree/main/docs"
Issues = "https://github.com/atabbott/mechanical-librarian/issues"
Repository = "https://github.com/atabbott/mechanical-librarian"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "mechanical_librarian._version.__version__" }

[tool.setuptools.package-data]
mechanical_librarian = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
