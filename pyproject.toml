[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanical-librarian"
dynamic = ["version"]
description = "Evidence-driven ebook and audiobook metadata curation"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "fastapi==0.141.1",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  # `interfaces/web/app.py` imports `starlette.types` directly, so Starlette is
  # a direct dependency and is pinned here rather than floating under FastAPI's
  # open `starlette>=0.46.0`. The floor is what clears the last advisory
  # affecting the locked closure: GHSA-82w8-qh3p-5jfq is fixed in 1.3.1, and
  # GHSA-86qp-5c8j-p5mr -- the `Host`-header path poisoning this project's own
  # trust boundary was decided on -- in 1.0.1.
  "starlette==1.6.0",
  "uvicorn==0.52.3",
]

[dependency-groups]
dev = [
  # The one-off test-value audit's two instruments, pinned so its recorded
  # commands reproduce. Neither is a gate and neither is imported by the suite:
  # `scripts/run_test_tier.py` never loads them, and `--disable-plugin-autoload`
  # keeps them out of a tier run even though `coverage` ships a `.pth`. That
  # `.pth` is inert unless `COVERAGE_PROCESS_START` is set, which only the
  # documented coverage command does.
  "coverage==7.13.0",
  "hypothesis==6.165.10",
  # `starlette.testclient` prefers `httpx2` and warns on the
  # `StarletteDeprecationWarning` class when it has to fall back to `httpx`.
  # `scripts/qualify_exact_artifact.py` fails its installed-workspace probe on
  # any stdout or stderr at all, so that warning is a hard qualification
  # failure, not cosmetic. This is the transport the test client uses; the
  # runtime `httpx==0.28.1` the adapters call remains a separate distribution
  # with a separate import name and is unaffected by it.
  "httpx2==2.10.0",
  "mutmut==3.3.1",
  "mypy==2.3.1",
  "playwright==1.62.0",
  "pytest==9.1.1",
  "ruff==0.16.3",
  "setuptools==83.0.0",
]

[tool.mutmut]
paths_to_mutate = [
  "src/mechanical_librarian/adapters/persistence/metadata_reports.py",
  "src/mechanical_librarian/application/review_web.py",
  "src/mechanical_librarian/bootstrap/composition.py",
  "src/mechanical_librarian/interfaces/cli/__init__.py",
  "src/mechanical_librarian/interfaces/web/app.py",
]
also_copy = [
  "docs",
  "scripts",
  "workbench",
  "frontend",
  ".github",
  "AGENTS.md",
  "CHANGELOG.md",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "DESIGN.md",
  "Dockerfile",
  "GOVERNANCE.md",
  "LICENSE",
  "MANIFEST.in",
  "PRODUCT.md",
  "README.md",
  "SECURITY.md",
  "SUPPORT.md",
  "compose.yaml",
  "osv-scanner.toml",
  "setup.py",
  "uv.lock",
]
tests_dir = [
  "tests/unit",
  "tests/integration",
  # Three modules qualify the build, the installed console script, or the
  # source-only workbench against the repository root they run from. Inside
  # `mutants/` that root is a copy, so they fail for the copy rather than for
  # any mutant. They cannot reach the audited modules, and mutmut's stats and
  # clean-test phases both run under `-x`, so they are excluded rather than
  # allowed to abort the run.
  "--ignore=tests/unit/test_exact_artifact_qualification.py",
  "--ignore=tests/unit/test_runtime_workbench.py",
  "--ignore=tests/integration/test_continuous_review_scale.py",
]

[project.scripts]
mechanical-librarian = "mechanical_librarian.bootstrap:main"
mechanical-librarian-container = "mechanical_librarian.bootstrap.container:main"
mechanical-librarian-container-health = "mechanical_librarian.bootstrap.container_health:main"

[project.urls]
Documentation = "https://github.com/atabbott/mechanical-librarian/tree/main/docs"
Issues = "https://github.com/atabbott/mechanical-librarian/issues"
Repository = "https://github.com/atabbott/mechanical-librarian"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "mechanical_librarian._version.__version__" }

[tool.setuptools.package-data]
mechanical_librarian = ["py.typed", "interfaces/web/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
# pytest is the execution engine under the tier system, not a second entry
# point beside it. `scripts/run_test_tier.py` names each cohort's exact files
# and supplies the arguments the tier contract needs, so these settings only
# have to keep a bare `pytest` invocation admitting the same cohort the tiers
# do: the public suite lives in `tests/`, and a test module is `test_*.py`.
# pytest's other default, `*_test.py`, is not a name this suite uses and would
# widen the cohort silently.
testpaths = ["tests"]
python_files = ["test_*.py"]
# An `xfail` that passes is a finding, not a pass. The tier runner refuses a
# run holding an unexpected success either way, but declaring it here makes a
# native `xfail` fail at the engine too rather than only in the accounting.
xfail_strict = true

[tool.ruff]
# The gate formats, lints, and type-checks the backend source, its tests, and
# its scripts.
src = ["src"]
target-version = "py313"
# ruff's own default, stated rather than inherited: one number now governs both
# what the formatter targets and what `E501` rejects, so the two can never
# disagree about the width they enforce.
line-length = 88
# Without this, an exclusion holds only for paths ruff discovers by walking a
# directory, and is ignored for any path named on the command line. That is the
# difference between `ruff format src` and `ruff format <one file>`, so the
# formatter exclusion below would protect the gate's directory invocation and
# nothing a contributor's editor, format-on-save, or pre-commit hook does --
# each of which formats the single file it is holding, and would rewrite a
# byte-frozen source. This makes the exclusion hold for every invocation.
# It is scoped to exclusions: `ruff check` still lints those four files, which
# is what keeps their per-file ignores below meaningful rather than moot.
force-exclude = true

[tool.ruff.format]
# The four sources named under `[tool.ruff.lint.per-file-ignores]` below are
# byte-frozen by the F20 rich-metadata qualification manifest. The formatter
# rewrites bytes by definition, and `# fmt: off` is itself a byte, so the only
# way to leave their digests intact is to keep the formatter out of them. This
# exclusion retires with the same re-qualification those lint entries do.
exclude = [
  "src/mechanical_librarian/adapters/library_services/audiobookshelf_field_effect.py",
  "src/mechanical_librarian/domain/automatic_decision.py",
  "src/mechanical_librarian/domain/metadata_policy.py",
  "src/mechanical_librarian/domain/rich_metadata_preview.py",
]

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E, W), bugbear (B), and import ordering (I).
select = ["F", "E", "W", "B", "I"]
ignore = [
  # E501 (line-too-long) is not enforced, and no longer for #652's reason: the
  # whole-tree reformat it deferred has happened, so `ruff format --check` now
  # holds every construct the formatter owns to `line-length` above. That is
  # the width gate. Measured against the formatted tree, what E501 would add on
  # top is 1,148 findings across 76 files, and not one is a line the formatter
  # could have made narrower:
  #   1,011  the limit falls inside a string literal -- DDL and SQL text that
  #          `sqlite_master` stores verbatim and `schema.py` therefore may not
  #          reflow, EPUB and XML fixture documents, and the synthetic Python
  #          modules `scripts/qualify_exact_artifact.py` and the tier tests
  #          embed as source text. A formatter never rewrites string contents.
  #      82  code in the four sources excluded from the formatter above, which
  #          it is not permitted to reach at all.
  #      55  code in formatted sources: dotted import paths and other single
  #          tokens with no split point in them.
  # The longest is 2,235 characters, so the only settings that make E501 pass
  # are 76 per-file exemptions -- covering the largest sources in the tree --
  # or a 2,236-character limit. Both report a pass while measuring nothing.
  #
  # A fourth group is named here because it is the one a reader is most likely
  # to think could simply be shortened: 103 further lines exceed the limit only
  # because they end in a `# type: ignore` or `# noqa` carrying the reason this
  # project requires beside it. They are absent from the 1,148 above -- ruff
  # exempts a line whose overrun begins inside a pragma comment, where it
  # reports an ordinary comment of the same width -- and they cannot be
  # shortened either, because mypy and ruff both bind a suppression to the
  # physical line it sits on, so moving it off that line stops it suppressing.
  # #670 had to reattach 22 of them after the reformat split their lines.
  #
  # Enforcing E501 for real means moving those literals out of Python source,
  # which is separate, owned work, not a threshold.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Four sources are byte-frozen by the F20 rich-metadata qualification
# manifest, `docs/reference/f20-rich-metadata-qualification-candidate-v1.json`.
# Its `frozen_contract` entries pin their sha256, and
# `tests/unit/test_rich_metadata_qualification_manifest.py` fails if any byte
# moves. An inline `# noqa` is itself a byte, so these findings cannot be
# suppressed at the site; the alternative -- rewriting the pinned digests --
# would weaken an existing gate to make a new one pass, which #652 forbids.
# Each entry lists only the codes present today, so a new finding of any other
# code in these files still fails the gate. Re-qualifying these sources is
# separate, owned work; when it happens these entries go away with it.
"src/mechanical_librarian/adapters/library_services/audiobookshelf_field_effect.py" = ["I001"]
"src/mechanical_librarian/domain/automatic_decision.py" = ["E731"]
"src/mechanical_librarian/domain/metadata_policy.py" = ["I001"]
"src/mechanical_librarian/domain/rich_metadata_preview.py" = ["F841", "I001"]

[tool.ruff.lint.flake8-bugbear]
# B008 exists because a mutable default is constructed once and then shared.
# These two are `@dataclass(frozen=True, slots=True)` value objects with no
# mutable state, so a shared instance is exactly the intent.
extend-immutable-calls = [
  "mechanical_librarian.application.cover_policy.CoverPolicy",
  "mechanical_librarian.domain.metadata_report.ProviderRequestAccounting",
]

[tool.ruff.lint.isort]
known-first-party = ["mechanical_librarian"]

[tool.mypy]
python_version = "3.13"
# Pin the analysed platform. The product ships as one Linux container and the
# gate runs on ubuntu, but contributors develop on other hosts. Without this,
# `sys.platform` branches and platform-gated typeshed symbols (os.memfd_create,
# fcntl) make the same source report different errors on macOS than in CI, so
# the documented local commands would not reproduce the gate.
platform = "linux"
# `scripts/` is not a package, so without these two settings mypy maps
# `scripts/x.py` to the module `x` when named directly and to `scripts.x` when
# reached through a test import, and refuses to check the tree. Rooting module
# names at `src/` first and then at the repository keeps `src`, `tests`, and
# `scripts` on one consistent naming scheme.
mypy_path = "src"
explicit_package_bases = true
strict = true
# Report suppressions that no longer suppress anything so the gate cannot rot.
warn_unused_ignores = true
warn_unused_configs = true

# The three overrides below cover sources that are byte-frozen by the F20
# rich-metadata qualification manifest,
# `docs/reference/f20-rich-metadata-qualification-candidate-v1.json`. Its
# `frozen_contract` entries pin their sha256 and
# `tests/unit/test_rich_metadata_qualification_manifest.py` fails if any byte
# moves, so neither an annotation nor an inline `# type: ignore` can be added
# at the site. Rewriting the pinned digests instead would weaken an existing
# gate to make this one pass, which #652 forbids. Each override names only the
# error codes those files produce today, so strict mode still applies to every
# other code in them and a new class of finding still fails the gate.
# `src/mechanical_librarian/domain/metadata_policy.py` is frozen too but needs
# no override: it is already clean under strict mode. These overrides retire
# with the next re-qualification of those sources.

[[tool.mypy.overrides]]
module = "mechanical_librarian.domain.rich_metadata_preview"
# reason: byte-frozen by the F20 qualification manifest; see the note above.
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "index",
  "misc",
  "operator",
  "union-attr",
]

[[tool.mypy.overrides]]
module = "mechanical_librarian.domain.automatic_decision"
# reason: byte-frozen by the F20 qualification manifest; see the note above.
disable_error_code = ["arg-type", "no-untyped-call"]

[[tool.mypy.overrides]]
module = "mechanical_librarian.adapters.library_services.audiobookshelf_field_effect"
# reason: byte-frozen by the F20 qualification manifest; see the note above.
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["mutmut.*"]
# reason: mutmut ships no `py.typed`, so its mutation engine and stats
# collector are untyped to mypy. Only the three `scripts/` entry points for
# #737's one-off audit import it; nothing under `src/` does, and nothing the
# gate runs loads it. Narrowed to the distribution rather than relaxing the
# importing modules, so every other symbol in them stays checked.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
# reason: `tests/` and `scripts/` are checked, but not held to strict mode's
# annotation requirements. #652 scopes strict to `src/`, which is what ships
# with `py.typed`; a test's job is to prove behaviour, and requiring a full
# signature on every fixture and fake would be a 70k-line annotation project
# rather than this gate. Bodies are still checked, and 19 of the 21 error
# classes these trees produce are enforced.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_subclassing_any = false
warn_return_any = false
# reason: these two are classes a test suite provokes by design. Tests reach
# for members that only a double defines (`attr-defined`) and index the
# JSON-shaped documents the code under test returns (`index`). Enforcing them
# would mean annotating the fixtures rather than finding defects, and every
# other class stays enforced so a new kind of finding here still fails the
# gate.
#
# `arg-type` was suppressed here too, for the same stated reason, and #693
# reversed that. It is the code that fires when a test binds a double into a
# port the double does not satisfy, and by then four defects had turned on it:
# #658's six-facade capability outage that 1,532 tests missed, #667's
# acceptance that had to be met by runtime reflection because no typing
# argument could reach it, #658's finding that no test composed the
# application the way `run_review_server` does, and #711 — where the
# suppression did not merely fail to catch the defect but disarmed the guard
# written to stop it recurring. That guard annotates a double's emitted row so
# a future narrowing fails the gate; appending a narrowed tuple to it reports
# `arg-type` and passed silently, and it only reported the enforced `misc`
# because the list happened to be built as one comprehension. A suppression
# that makes a broken guard indistinguishable from a working one is a
# different thing from one that leaves a defect uncaught.
#
# Measured before reversing it, by copying this file with only this line
# changed and running `mypy src tests scripts --config-file <copy>`: 480
# findings in 48 files. Passing `--enable-error-code arg-type` on the command
# line instead reports a clean run — a per-module `disable_error_code` wins
# over it — so that is a false negative, not a measurement. Of the 480, 143
# are a double bound into a port it does not satisfy, and 43 of those name the
# missing protocol member outright; the other 337 are value widening from the
# JSON-shaped read idiom, whose remedy is a cast at the fixture site. Burning
# down all 480 would therefore buy the composition class at the price of the
# annotation project this override exists to avoid, so the default was
# inverted instead: `arg-type` is enforced here, and the 48 modules carrying
# findings today are named in the override below. That gates 90 of the 137
# test modules at once, including every shared double under `tests/support/`,
# and gates every module written from now on.
disable_error_code = ["attr-defined", "index"]

[[tool.mypy.overrides]]
# reason: the `arg-type` burn-down backlog from #693, and nothing else. Each
# module below carried at least one `arg-type` finding when the code was
# enforced above, and suppressing it per module keeps the enforced default
# correct for every module not on this list. The list can only shrink: fix a
# module's findings and delete its entry. It is not a judgement that the
# findings are noise — `tests/unit/test_review_application.py` is here because
# the shared `FakeReviewRepository` satisfies none of `BrowserStateOwner`'s
# three members and 12 of `ReviewPolicyStore`'s 19, `automatic_safety_state`
# among them, which is the member #658's outage was about. Removing an entry
# is real work with real risk, because a double that starts satisfying a port
# can change what a test proves: `AutomaticSafetyControls` reports a missing
# member as "automatic safety is unavailable", so a test proving that state
# may depend on the double lacking it.
module = [
  "scripts.qualify_audiobookshelf_field_effect",
  "tests.unit.test_audiobookshelf_field_effect",
  "tests.unit.test_automatic_decision",
  "tests.unit.test_batch",
  "tests.unit.test_batch_composition",
  "tests.unit.test_bibliographic_bundles",
  "tests.unit.test_catalogue",
  "tests.unit.test_contained_reviewer",
  "tests.unit.test_continuous_field_effects",
  "tests.unit.test_cover_activation",
  "tests.unit.test_cover_consideration",
  "tests.unit.test_cover_observer",
  "tests.unit.test_cover_packets",
  "tests.unit.test_cover_review_cli",
  "tests.unit.test_epub_child",
  "tests.unit.test_epub_inspection",
  "tests.unit.test_epub_opening",
  "tests.unit.test_exact_artifact_qualification",
  "tests.unit.test_field_effects",
  "tests.unit.test_hardcover_lanes",
  "tests.unit.test_hardcover_rich_projection",
  "tests.unit.test_human_decision",
  "tests.unit.test_metadata_policy",
  "tests.unit.test_metadata_policy_activation",
  "tests.unit.test_metadata_report_application",
  "tests.unit.test_metadata_report_discovery",
  "tests.unit.test_metadata_report_evidence",
  "tests.unit.test_open_library_batch",
  "tests.unit.test_playwright_browser_verification",
  "tests.unit.test_policy_preview_cli",
  "tests.unit.test_proposal_corroboration",
  "tests.unit.test_provider_recovery",
  "tests.unit.test_provider_retry_successor",
  "tests.unit.test_remote_cover",
  "tests.unit.test_review_application",
  "tests.unit.test_review_case_persistence",
  "tests.unit.test_review_field_classification",
  "tests.unit.test_review_library_persistence",
  "tests.unit.test_review_pipeline",
  "tests.unit.test_review_session_persistence",
  "tests.unit.test_review_tls",
  "tests.unit.test_review_web_read_models",
  "tests.unit.test_review_web_transport",
  "tests.unit.test_shadow_decision",
  "tests.unit.test_shadow_outcome_persistence",
  "tests.unit.test_shadow_review_actions",
  "tests.unit.test_shadow_review_packets",
  "tests.unit.test_validation_vocabulary",
]
disable_error_code = ["arg-type", "attr-defined", "index"]
